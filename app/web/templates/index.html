<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ app_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
</head>
<body>
    <main class="shell">
        <header class="hero">
            <p class="eyebrow">Yerel ürün araştırma sistemi</p>
            <h1>{{ app_name }}</h1>
            <p class="lede">Gerçek, izlenebilir pazar verisiyle fırsat analizi.</p>
        </header>
        <section class="status-panel" aria-labelledby="system-status">
            <div>
                <p class="label">Sistem durumu</p>
                <h2 id="system-status">Kurulum hazır</h2>
            </div>
            <span class="badge">{{ environment }}</span>
        </section>
        <section class="empty-state" aria-labelledby="data-status">
            <p class="label">Veri durumu</p>
            <h2 id="data-status">{{ data_state }}</h2>
            <p>Henüz canlı tarama yapılmadı. Uygulama örnek veya sahte pazar verisi göstermez.</p>
        </section>
    </main>
</body>
</html>
