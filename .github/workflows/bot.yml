name: Run guarded market bot

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: guarded-market-bot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIRSAT_RADAR_ENVIRONMENT: production
      FIRSAT_RADAR_BROWSER_CHANNEL: ""
      FIRSAT_RADAR_BROWSER_HEADLESS: "false"
      FIRSAT_RADAR_DATA_DIR: data
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/firsat_radar.db
            data/policy
          key: market-data-${{ github.run_id }}
          restore-keys: market-data-
      - run: python -m pip install --disable-pip-version-check -r requirements.lock
      - run: python -m pip install --disable-pip-version-check --no-deps -e .
      - run: python -m playwright install --with-deps chromium
      - run: python -m app.cli init-db
      - name: Validate source policy
        run: |
          result=$(xvfb-run -a python -m app.cli policy-check --source hepsiburada)
          printf '%s\n' "$result"
      - run: python -m app.cli analyze --limit-products 200
      - run: python -m app.cli export-site --output public
      - uses: actions/cache/save@v4
        with:
          path: |
            data/firsat_radar.db
            data/policy
          key: market-data-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
